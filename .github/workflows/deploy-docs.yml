name: deploy-docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # docs-compiler SSG at the production root (Phase C flip, PARITY.md):
  # the island pipeline + static shell built from crates.io's
  # docs-compiler. Legacy astro routes resolve through meta-refresh
  # stubs emitted by gen-redirects.mjs. Rollback = revert this commit
  # (the astro root re-deploys on the next push).
  build-preview-ssg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install docs-compiler (published crate, pinned)
        run: cargo install --locked --version 0.7.6 docs-compiler
      - name: clone docs-core for the island shim
        run: git clone --depth 1 https://github.com/WyattAu/docs-core ../docs-core
      - name: build islands + docs site (preview subpath)
        run: bun run build:islands
      - name: docs-compiler build (production root)
        run: |
          docs-compiler build docs-site-src \
            --out preview-site \
            --base-path /solid-fx
          cp -r dist-islands preview-site/_assets/islands
          test -f preview-site/search.json
          test -f preview-site/_assets/islands/seo-doc-search.js
      - name: legacy route redirect stubs (astro + retired preview paths)
        run: bun scripts/gen-redirects.mjs preview-site
      - uses: actions/upload-artifact@v4
        with:
          name: ssg-preview
          path: preview-site
          retention-days: 7

  merge-and-upload:
    needs: [build-preview-ssg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ssg-preview
          path: merged
      - uses: actions/upload-pages-artifact@v3
        with:
          path: merged

  deploy:
    needs: merge-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
