name: screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC

permissions:
  contents: read

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Serve dist and capture all component pages
        run: |
          (bunx astro preview --port 4321 &)
          sleep 5
          node scripts/shoot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
